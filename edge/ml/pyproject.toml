[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "study-space-people-count-ml"
version = "0.1.0"
description = "People-count prediction pipeline for privacy-preserving study space advisor"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "joblib>=1.3",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "tabulate>=0.9"
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
study-space-ml-count-inspect = "study_space_ml.scripts.inspect_dataset:main"
study-space-ml-count-features = "study_space_ml.scripts.extract_features:main"
study-space-ml-count-train = "study_space_ml.scripts.train_people_count:main"
study-space-ml-count-predict = "study_space_ml.scripts.predict_people_count:main"
study-space-ml-count-leave-one-session = "study_space_ml.scripts.leave_one_session_eval:main"
study-space-ml-live = "study_space_ml.scripts.stream_live:main"

[tool.setuptools.packages.find]
where = ["src"]
