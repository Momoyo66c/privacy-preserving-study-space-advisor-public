room_id: room_a
device_id: pi5-a
window_seconds: 5

simulator:
  enabled: false
  scenario: quiet_study_recommended
  random_seed: 3025

transport:
  mode: esp32_hub
  port: ${ESP32_HUB_PORT}
  baud_rate: 460800
  read_timeout_s: 0.05
  reconnect_delay_s: 0.25
  startup_timeout_s: 2.0
  sample_timeout_s: 0.75
  queue_size: 64

sensors:
  thermal:
    enabled: true
    sample_rate_hz: 2
    max_retries: 2
    offline_threshold: 3
    options:
      minimum_c: -40
      maximum_c: 300
  radar:
    # Enable after the LD2450 arrives and GPIO16/17 wiring is verified.
    enabled: false
    sample_rate_hz: 10
    max_retries: 1
    offline_threshold: 3
  sound:
    enabled: true
    sample_rate_hz: 4
    max_retries: 1
    offline_threshold: 3
  light:
    enabled: true
    sample_rate_hz: 1
    max_retries: 1
    offline_threshold: 3
  climate:
    enabled: true
    # DHT11 must not be read more often than about once every two seconds.
    sample_rate_hz: 0.5
    max_retries: 1
    offline_threshold: 3

storage:
  data_dir: data/sessions
  retention_days: 30
  max_sessions: 100

actuation:
  device: log
  buzzer_enabled: false
  options: {}
