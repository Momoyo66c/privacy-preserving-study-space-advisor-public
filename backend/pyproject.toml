[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "study-space-api"
version = "0.1.0"
description = "Privacy-preserving study space backend and forecasting API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2,<3",
  "jsonschema[format]>=4.23,<5",
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
]

[project.scripts]
study-space-api = "study_space_api.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = ["performance: local latency checks that are not stable CI gates"]

[tool.coverage.run]
source = ["study_space_api"]
